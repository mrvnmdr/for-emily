<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Emily</title>
    <style>
        :root {
            --primary: #ff5e78;
            --bg: #fff5f6;
            --text: #2d3436;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
            overflow: hidden;
            touch-action: manipulation;
        }

        .container {
            text-align: center;
            padding: 2rem;
            width: 90%;
            max-width: 400px;
            z-index: 10;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 2rem;
            line-height: 1.3;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        button {
            padding: 16px 32px;
            font-size: 1.1rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .btn-yes {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 94, 120, 0.3);
        }

        .btn-no {
            background-color: #dfe6e9;
            color: #636e72;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Blumen-Styling */
        .flower {
            position: absolute;
            font-size: 2rem;
            pointer-events: auto;
            cursor: pointer;
            user-select: none;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Erfolg-Screen */
        .hidden { display: none; }
        
        .success-message {
            font-size: 1.5rem;
            color: var(--primary);
            animation: fadeIn 1s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <h1>Emily,<br>will you be my Valentine?</h1>
        <div class="btn-group">
            <button class="btn-yes" onclick="showSuccess()">Ja, natürlich! ❤️</button>
            <button class="btn-no" onclick="wrongAnswer()">Uhm, mal sehen...</button>
        </div>
    </div>

    <div class="container hidden" id="success-card">
        <div class="success-message">
            <h1>Yay! 🌸</h1>
            <p>Das war die einzig richtige Entscheidung. Ich freue mich!</p>
        </div>
    </div>

    <script>
        const flowers = ['🌸', '🌼', '🌺', '🌷', '🌻'];
        
        // Blumen generieren
        function createFlowers() {
            for (let i = 0; i < 12; i++) {
                const flower = document.createElement('div');
                flower.className = 'flower';
                flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];
                
                // Zufällige Position
                flower.style.left = Math.random() * 90 + 'vw';
                flower.style.top = Math.random() * 90 + 'vh';
                
                // Klick-Event für Drehung
                let rotation = 0;
                flower.addEventListener('click', () => {
                    rotation += 360;
                    flower.style.transform = `rotate(${rotation}deg) scale(1.5)`;
                    setTimeout(() => flower.style.transform = `rotate(${rotation}deg) scale(1)`, 500);
                });

                document.body.appendChild(flower);
            }
        }

        function wrongAnswer() {
            alert("Hoppla! Da ist wohl jemand mit dem Finger abgerutscht. Versuch's nochmal! 😉");
            // Wir machen nichts, außer sie wieder auf die Frage zu fokussieren
        }

        function showSuccess() {
            document.getElementById('main-card').classList.add('hidden');
            document.getElementById('success-card').classList.remove('hidden');
            
            // Konfetti-Effekt mit Blumen
            for(let i=0; i<20; i++) {
                setTimeout(createFlowers, i * 100);
            }
        }

        // Initial ein paar Blumen verteilen
        createFlowers();
    </script>
</body>
</html>
